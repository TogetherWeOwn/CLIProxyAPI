name: auto-retarget-main-pr-to-dev

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
    branches:
      - main

permissions: {}

concurrency:
  group: retarget-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retarget:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check App bindings
        env:
          APP_CONFIGURED: ${{ vars.PR_AUTOMATION_APP_CLIENT_ID != '' && secrets.PR_AUTOMATION_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$APP_CONFIGURED" != "true" ]; then
            printf '%s\n' 'PR automation App bindings are missing.' >&2
            exit 1
          fi

      - name: Create repository-scoped PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PR_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Retarget PR base to dev
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const desiredBase = "dev";
            const validPR = (value) =>
              Number.isSafeInteger(value?.number) && value.number > 0 &&
              value.base?.repo?.full_name === repository &&
              typeof value.base?.ref === "string" &&
              typeof value.head?.ref === "string" &&
              /^[0-9a-f]{40}$/.test(value.head?.sha ?? "");

            if (!validPR(pr)) {
              core.setFailed("Invalid pull request metadata.");
              return;
            }
            if (!["opened", "reopened", "edited"].includes(context.payload.action)) {
              core.info("Unsupported event; nothing to do.");
              return;
            }
            if (!process.env.APP_SLUG) {
              core.setFailed("PR automation App identity is missing.");
              return;
            }
            if (context.payload.action === "edited" &&
                context.actor === `${process.env.APP_SLUG}[bot]`) {
              core.info("Ignoring this App's repeated edit event.");
              return;
            }
            if (pr.state !== "open" || pr.base.ref !== "main" || pr.head.ref === desiredBase) {
              core.info("PR is not eligible for main -> dev retargeting.");
              return;
            }

            const prNumber = pr.number;
            try {
              const { data: current } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              if (!validPR(current) || current.number !== prNumber) {
                core.setFailed("Invalid current pull request metadata.");
                return;
              }
              if (current.state !== "open" || current.base.ref !== "main" ||
                  current.head.ref !== pr.head.ref || current.head.sha !== pr.head.sha) {
                core.info("PR changed since the event; skipping stale retarget.");
                return;
              }

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                base: desiredBase,
              });
            } catch {
              core.setFailed(`Failed to retarget PR #${prNumber} to ${desiredBase}.`);
              return;
            }

            const body = [
              "This pull request targeted `main`.",
              "",
              "The base branch has been automatically changed to `dev`.",
            ].join("\n");

            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            } catch {
              core.warning(`Failed to comment on PR #${prNumber}.`);
            }
