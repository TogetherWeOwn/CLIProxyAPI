name: stock-recovery-source

on:
  pull_request:
    paths:
      - 'ops/stock-recovery/**'
      - '.github/workflows/stock-recovery-source.yml'

permissions:
  contents: read

jobs:
  source-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test offline source binding, not runtime recovery
        run: python3 -I ops/stock-recovery/test_packet.py -v
      - name: Test synthetic response validators, not runtime recovery
        run: python3 -I ops/stock-recovery/test_service_evidence.py -v
      - name: Test wrapper ownership and attempt records, not runtime recovery
        run: python3 -I ops/stock-recovery/test_attempt.py -v
      - name: Test frozen-runtime archive controls, not runtime recovery
        run: python3 -I ops/stock-recovery/test_runtime_artifact.py -v
      - name: Record source-only HOLD report
        run: |
          mkdir -p qualification-evidence
          python3 -I ops/stock-recovery/packet.py ops/stock-recovery/manifest.json > qualification-evidence/source-binding.json
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          identity = {
              "head_sha": os.environ["HEAD_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "qualification": "HOLD",
              "service_recovery": "NOT_TESTED",
          }
          Path("qualification-evidence/actions-identity.json").write_text(json.dumps(identity, sort_keys=True) + "\n")
          PY
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Retain source checkpoint evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stock-recovery-source-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: qualification-evidence/
          if-no-files-found: error
          retention-days: 14

  runtime-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set disposable download and test-root locations
        run: |
          printf 'DOWNLOAD=%s/stock-runtime-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'ROOT=%s/stock-root-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Materialize the frozen OCI runtime without executing archive content
        run: |
          mkdir -p runtime-evidence
          python3 -I ops/stock-recovery/runtime_artifact.py ops/stock-recovery/manifest.json "$DOWNLOAD" > runtime-evidence/artifact.json
      - name: Smoke-test help in an unprivileged empty root and network namespace
        run: |
          mkdir -m 755 "$ROOT"
          install -m 755 "$DOWNLOAD/runtime/CLIProxyAPI" "$ROOT/CLIProxyAPI"
          # Frozen loader set from the same image layers; no host libraries.
          # Recreate the image's merged-usr topology so PT_INTERP resolves:
          # /lib64 -> usr/lib64, /lib -> usr/lib, and the loader symlink.
          mkdir -p -m 755 "$ROOT/usr/lib/x86_64-linux-gnu" "$ROOT/usr/lib64" "$ROOT/etc"
          for lib in ld-linux-x86-64.so.2 libc.so.6 libm.so.6 libdl.so.2 \
                     libpthread.so.0 libgcc_s.so.1; do
            install -m 755 "$DOWNLOAD/runtime/libs/usr/lib/x86_64-linux-gnu/$lib" \
              "$ROOT/usr/lib/x86_64-linux-gnu/$lib"
          done
          install -m 644 "$DOWNLOAD/runtime/libs/etc/ld.so.cache" "$ROOT/etc/ld.so.cache"
          ln -s /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 "$ROOT/usr/lib64/ld-linux-x86-64.so.2"
          ln -s usr/lib "$ROOT/lib"
          ln -s usr/lib64 "$ROOT/lib64"
          # No host state, store, provider, network interface, daemon or environment.
          sudo unshare --net --pid --fork --kill-child \
            env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            chroot --userspec=65534:65534 "$ROOT" /CLIProxyAPI --help \
            > runtime-evidence/help.log 2>&1
      - name: Verify help output identifies the frozen candidate
        run: |
          python3 -I - <<'PY'
          import hashlib
          from pathlib import Path
          data = Path("runtime-evidence/help.log").read_bytes()
          if not 0 < len(data) <= 65536:
              raise SystemExit("help output size out of bounds")
          text = data.decode(errors="strict")
          for marker in ("CLIProxyAPI Version: v8.0.60", "Commit: 91e0dee",
                         "\nUsage of /CLIProxyAPI\n", "\n  -config", "\n  -tui"):
              if marker not in text:
                  raise SystemExit("help output missing frozen marker: " + marker)
          print("help sha256:", hashlib.sha256(data).hexdigest())
          print("markers: version, commit, usage, config, tui")
          PY
      - name: Record bootstrap identity, never functional acceptance
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p runtime-evidence
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          identity = {key: os.environ[key] for key in ("HEAD_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB", "JOB_STATUS")}
          identity.update(qualification="HOLD", service_recovery="NOT_TESTED", journal_matrix="NOT_RUN")
          Path("runtime-evidence/actions-identity.json").write_text(json.dumps(identity, sort_keys=True) + "\n")
          PY
      - name: Remove disposable downloaded bytes and empty test root
        if: always()
        run: |
          for directory in "$ROOT" "$DOWNLOAD"; do
            if [ -e "$directory" ]; then
              test ! -L "$directory"
              ls -ld -- "$directory"
              rm -r -- "$directory"
              test ! -e "$directory"
            fi
          done
      - name: Retain bootstrap evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-bootstrap-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 14
