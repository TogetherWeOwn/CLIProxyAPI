name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output

  go-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full Go suite at PR head
        shell: bash
        run: go test -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-tests.log"
      - name: Retain raw Go result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/go-tests.log
          if-no-files-found: error

  recovery-components:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare protected component fixture home
        shell: bash
        run: |
          {
            git rev-parse HEAD
            python3 --version
            uname -sr
            systemd-analyze --version
            go version
            python3 -I - <<'PY'
          import os
          from pathlib import Path
          import pwd
          import stat
          import sys

          sys.path.insert(0, str(Path.cwd() / "ops/host-recovery"))
          from host_recovery.installation import FLAGS, protected

          # Synthetic protected-path fixtures live below the runner account's
          # home. Tighten only that owned directory, never relax the guard or
          # change ancestors, owners, ACLs or other extended metadata.
          uid = os.geteuid()
          home = Path(pwd.getpwuid(uid).pw_dir)
          fd = os.open(home, FLAGS)
          try:
              before = os.fstat(fd)
              if before.st_uid != uid:
                  raise RuntimeError("component fixture home is not runner-owned")
              mode = stat.S_IMODE(before.st_mode)
              os.fchmod(fd, mode & ~0o022)
              print(f"fixture home uid={uid} mode={mode:04o}->{mode & ~0o022:04o}", flush=True)
          finally:
              os.close(fd)

          fd = os.open("/", FLAGS)
          try:
              protected(fd, uid)
              for part in home.parts[1:]:
                  child = os.open(part, FLAGS, dir_fd=fd)
                  os.close(fd)
                  fd = child
                  info = os.fstat(fd)
                  print(f"fixture ancestor uid={info.st_uid} mode={stat.S_IMODE(info.st_mode):04o}", flush=True)
                  protected(fd, uid)
          finally:
              os.close(fd)
          PY
          } 2>&1 | tee "$RUNNER_TEMP/recovery-environment.log"
      - name: Python recovery components at PR head
        shell: bash
        run: python3 -I ops/host-recovery/tests/run.py 2>&1 | tee "$RUNNER_TEMP/recovery-components.log"
      - name: Retain raw component result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-components-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/recovery-environment.log
            ${{ runner.temp }}/recovery-components.log
          if-no-files-found: error

  recovery-race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Affected Go race suites at PR head
        shell: bash
        run: |
          go test -race -count=1 ./internal/recoverycorrelation ./internal/api/middleware ./internal/config ./internal/pluginhost ./internal/client/codex/live ./sdk/api/handlers ./sdk/api/handlers/openai ./ops/host-recovery/inputguard 2>&1 | tee "$RUNNER_TEMP/recovery-race.log"
      - name: Retain raw race result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-race-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/recovery-race.log
          if-no-files-found: error
