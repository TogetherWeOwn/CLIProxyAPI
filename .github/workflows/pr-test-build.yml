name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output

  go-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full Go suite at PR head
        shell: bash
        run: go test -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-tests.log"
      - name: Retain raw Go result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/go-tests.log
          if-no-files-found: error

  recovery-components:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare protected component fixture home
        shell: bash
        run: |
          # This job runs only on a disposable GitHub-hosted runner. Create a
          # fresh short path outside /home (which can carry inherited metadata).
          fixture_root="$(sudo mktemp -d /cpa-recovery-fixtures.XXXXXX)"
          sudo chown "$(id -u):$(id -g)" "$fixture_root"
          export CPA_RECOVERY_TEST_ROOT="$fixture_root"
          printf 'CPA_RECOVERY_TEST_ROOT=%s\n' "$fixture_root" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            python3 --version
            uname -sr
            systemd-analyze --version
            go version
            python3 -I - <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys

          sys.path.insert(0, str(Path.cwd() / "ops/host-recovery"))
          from host_recovery.installation import FLAGS, protected

          # Validate the fresh fixture root using the unchanged production guard.
          # Do not alter /home, ancestor permissions, ACLs or extended metadata.
          uid = os.geteuid()
          home = Path(os.environ["CPA_RECOVERY_TEST_ROOT"])
          if home.stat().st_uid != uid:
              raise RuntimeError("component fixture root is not runner-owned")

          fd = os.open("/", FLAGS)
          try:
              info = os.fstat(fd)
              print(f"fixture ancestor uid={info.st_uid} mode={stat.S_IMODE(info.st_mode):04o} xattrs={os.listxattr(fd)!r}", flush=True)
              protected(fd, uid)
              for part in home.parts[1:]:
                  child = os.open(part, FLAGS, dir_fd=fd)
                  os.close(fd)
                  fd = child
                  info = os.fstat(fd)
                  print(f"fixture ancestor uid={info.st_uid} mode={stat.S_IMODE(info.st_mode):04o} xattrs={os.listxattr(fd)!r}", flush=True)
                  protected(fd, uid)
          finally:
              os.close(fd)
          PY
          } 2>&1 | tee "$RUNNER_TEMP/recovery-environment.log"
      - name: Python recovery components at PR head
        shell: bash
        run: python3 -I ops/host-recovery/tests/run.py 2>&1 | tee "$RUNNER_TEMP/recovery-components.log"
      - name: Native recovery manager transport on disposable private bus
        shell: bash
        run: |
          # No host/system bus or real systemd service is used by this matrix.
          command -v dbus-run-session
          timeout 120s dbus-run-session -- env CPA_RECOVERY_PRIVATE_BUS_TEST=1 python3 -I ops/host-recovery/tests/test_manager_bus_native.py 2>&1 | tee "$RUNNER_TEMP/recovery-private-bus.log"
      - name: Remove empty fixture root
        if: always() && env.CPA_RECOVERY_TEST_ROOT != ''
        shell: bash
        # Only remove the exact empty directory created above. Removing an entry
        # from / needs privilege even when that entry is owned by the runner.
        run: sudo rmdir -- "$CPA_RECOVERY_TEST_ROOT"
      - name: Retain raw component result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-components-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/recovery-environment.log
            ${{ runner.temp }}/recovery-components.log
            ${{ runner.temp }}/recovery-private-bus.log
          if-no-files-found: error

  recovery-race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Affected Go race suites at PR head
        shell: bash
        run: |
          go test -race -count=1 ./internal/recoverycorrelation ./internal/api/middleware ./internal/config ./internal/pluginhost ./internal/client/codex/live ./sdk/api/handlers ./sdk/api/handlers/openai ./ops/host-recovery/inputguard 2>&1 | tee "$RUNNER_TEMP/recovery-race.log"
      - name: Heartbeat failover regression at PR head
        shell: bash
        run: |
          go test -race -count=25 -timeout=180s -run '^TestServiceHeartbeatFailoverDoesNotDrainBlockingScope$' ./sdk/cliproxy 2>&1 | tee "$RUNNER_TEMP/heartbeat-failover.log"
      - name: Websocket keepalive upload regression at PR head
        shell: bash
        run: |
          go test -race -count=100 -timeout=180s -run '^TestCodexWebsockets_KeepalivePingDuringUpload_WithSession$' ./internal/runtime/executor 2>&1 | tee "$RUNNER_TEMP/websocket-keepalive-upload.log"
      - name: Retain raw race result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-race-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/recovery-race.log
            ${{ runner.temp }}/heartbeat-failover.log
            ${{ runner.temp }}/websocket-keepalive-upload.log
          if-no-files-found: error
