name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify PR head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_head_sha=$(git rev-parse HEAD)
          printf 'Expected PR head: %s\nChecked-out HEAD: %s\n' "$EXPECTED_HEAD_SHA" "$actual_head_sha"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build PR head
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
